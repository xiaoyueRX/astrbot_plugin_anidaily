name: astrbot_plugin_anidaily
display_name: 番剧每日推送
short_desc: 基于 yuc.wiki 的 4K 高清番剧每日更新提醒
desc: |
  基于 yuc.wiki 数据的番剧每日更新提醒插件，提供 4K 极精美深色卡片。

  - 🌸 **今日番剧**：每日定时推送当天更新的番剧列表，精彩不再错过。
  - 🎨 **精美卡片**：4K 级超清渲染，包含封面海报、放送时间及连载状态。
  - 🚀 **即时获取**：使用 `/anidaily now` 随时查看今日更新。
  - ⚙️ **灵活配置**：支持自定义推送时间（Cron 表达式）。
version: 0.1.2
author: xiaoyueRX
repo: https://github.com/xiaoyueRX/astrbot_plugin_anidaily
social_link: https://github.com/xiaoyueRX
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - discord
  - kook
  - satori
tags:
  - anime
  - 番剧
  - 推送
