name: astrbot_plugin_anidaily
display_name: 番剧每日推送
short_desc: 基于 yuc.wiki 的 4K 高清番剧每日更新提醒
desc: |
  每日定时推送今日更新的番剧列表，提供 4K 级精美深色卡片。
  
  - 🚀 4K 超清渲染：封面海报、时间、连载状态一目了然
  - ⏰ 定时推送：支持 Cron 表达式自定义（默认 08:20）
  - 🛠️ 简单命令：`/anidaily now` 获取即时卡片
  - 🔐 权限管理：订阅操作仅管理员可用
